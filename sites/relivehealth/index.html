  return html`<span ref=${ref}>${v.toFixed(decimals)}${suffix}</span>`;
};

          <div class="lg:col-span-7 p-8 sm:p-12 lg:p-16 flex flex-col justify-center">

            <h3 class="mt-5 font-display text-2xl sm:text-3xl leading-tight font-medium">${d.cmo.title[0]} <span class="font-serif italic font-normal text-cyan-300">${d.cmo.title[1]}</span></h3>
            <p class="mt-5 text-[15px] leading-relaxed text-white/65">${d.cmo.bio}</p>
            <blockquote class="mt-8 border-l-2 border-cyan pl-6 font-serif italic text-xl sm:text-2xl leading-snug text-white/90">“${d.cmo.quote}”</blockquote>
            <p class="mt-4 pl-6 text-[12px] font-semibold uppercase tracking-[0.2em] text-white/50">${d.cmo.name} · ${d.cmo.role}</p>
          </div>
        </div>
      </${Reveal}>

      <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
        ${d.doctors.map((m, k) => html`<${Reveal} key=${k} d=${k * 0.1}>
          <article class="group grid grid-cols-1 sm:grid-cols-5 overflow-hidden rounded-[32px] bg-mist h-full">
            <div class="sm:col-span-2 relative min-h-[300px] overflow-hidden"><img src=${m.image} alt=${m.name} loading="lazy" class="absolute inset-0 h-full w-full object-cover object-top transition-transform duration-700 group-hover:scale-105" /></div>
            <div class="sm:col-span-3 p-7 flex flex-col">
              <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-cyan-600">${m.role}</p>
              <h3 class="mt-2 font-display text-2xl font-medium">${m.name}</h3>
              <${motion.p} initial=${false} animate=${{ height: open === k ? 'auto' : 96 }} class="mt-4 overflow-hidden text-[14.5px] leading-relaxed text-graphite/65">${m.bio}</${motion.p}>
              <button onClick=${() => setOpen(open === k ? null : k)} aria-expanded=${open === k} class="mt-auto pt-5 inline-flex items-center gap-2 self-start text-[12px] font-semibold uppercase tracking-[0.16em] text-graphite"><span class=${`grid h-7 w-7 place-items-center rounded-full bg-graphite text-white transition-transform ${open === k ? 'rotate-45' : ''}`}><${Icon} n="plus" c="w-3.5 h-3.5" /></span>${open === k ? 'Show less' : 'Read bio'}</button>
            </div>
          </article>
        </${Reveal}>`)}
      </div>
    </${Wrap}>
  </section>`;
};

/* ============================= Testimonials ============================= */
const Reel = ({ src, k }) => {
  const v = useRef(null); const [on, setOn] = useState(false);
  const toggle = () => { const el = v.current; if (!el) return; if (el.paused) { document.querySelectorAll('video[data-reel]').forEach((o) => o !== el && o.pause()); el.muted = false; el.play(); } else el.pause(); };
  return html`<div class="relative shrink-0 w-[240px] sm:w-[270px] aspect-[9/16] snap-start overflow-hidden rounded-[28px] bg-graphite-700">
    <video ref=${v} data-reel src=${src + '#t=0.5'} preload="metadata" playsinline class="absolute inset-0 h-full w-full object-cover" onPlay=${() => setOn(true)} onPause=${() => setOn(false)} onEnded=${() => setOn(false)}></video>
    <button onClick=${toggle} aria-label=${on ? 'Pause testimonial' : `Play testimonial ${k + 1}`} class=${`absolute inset-0 flex flex-col justify-between p-5 text-left transition-opacity ${on ? 'opacity-0 hover:opacity-100' : ''}`}>
      <span class="self-start rounded-full bg-white/15 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-white backdrop-blur">Member story</span>
      <span class="flex items-center gap-3"><span class="grid h-12 w-12 place-items-center rounded-full bg-white text-graphite shadow-xl"><${Icon} n=${on ? 'mute' : 'play'} c="w-5 h-5" /></span><span class="text-sm font-medium text-white drop-shadow">${on ? 'Pause' : 'Watch story'}</span></span>
    </button>
  </div>`;
};
const Testimonials = ({ d }) => {
  const track = useRef(null);
  const nudge = (dir) => track.current?.scrollBy({ left: dir * 560, behavior: 'smooth' });
  return html`
  <section id=${d.id} class="py-24 lg:py-32 bg-graphite text-white overflow-hidden">
    <${Wrap}>
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
        <div class="lg:col-span-6"><${Reveal}><${Eyebrow} light>${d.eyebrow}</${Eyebrow}><${H2} t=${d.title} light c="mt-5" /></${Reveal}></div>
        <div class="lg:col-span-4"><p class="text-[16px] leading-relaxed text-white/65">${d.body}</p></div>
        <div class="lg:col-span-2 flex lg:justify-end gap-2">${[-1, 1].map((x) => html`<button key=${x} onClick=${() => nudge(x)} aria-label=${x < 0 ? 'Previous' : 'Next'} class="grid h-12 w-12 place-items-center rounded-full border border-white/20 hover:bg-white hover:text-graphite transition"><${Icon} n="arrow" c=${`w-5 h-5 ${x < 0 ? 'rotate-180' : ''}`} /></button>`)}</div>
      </div>
    </${Wrap}>
    <div ref=${track} class="no-scrollbar mt-12 flex gap-4 overflow-x-auto snap-x snap-mandatory scroll-px-[5vw] px-[5vw]">${d.videos.map((src, k) => html`<${Reel} key=${k} src=${src} k=${k} />`)}</div>
    <${Wrap} c="mt-14 grid grid-cols-1 sm:grid-cols-3 gap-4">
      ${d.stats.map((s, k) => html`<div key=${k} class="rounded-3xl border border-white/10 p-7 flex items-end justify-between"><p class="text-[12px] font-semibold uppercase tracking-[0.18em] text-white/50">${s.label}</p><p class="font-display text-4xl text-cyan-300 flex items-center gap-2">${k === 0 && html`<${Icon} n="star" c="w-6 h-6 fill-cyan-300" />`}<${Counter} ...${s} /></p></div>`)}
    </${Wrap}>
  </section>`;
};

/* ================================= CTA ================================== */
const CTA = ({ d, g }) => {
  const [zip, setZip] = useState(''); const [done, setDone] = useState(false);
  return html`
  <section id=${d.id} class="py-6 sm:py-10 bg-white">
    <${Wrap}>
      <div class="relative overflow-hidden rounded-[40px] bg-graphite text-white">
        <img src=${d.image} alt="" class="absolute inset-0 h-full w-full object-cover object-right opacity-60" loading="lazy" />
        <div class="absolute inset-0 bg-gradient-to-r from-graphite via-graphite/85 to-graphite/20"></div>
        <div class="relative grid grid-cols-1 lg:grid-cols-12 gap-10 p-8 sm:p-14 lg:p-20">
          <div class="lg:col-span-7">
            <${Reveal}><${H2} t=${d.title} light /><p class="mt-6 max-w-xl text-[17px] leading-relaxed text-white/70">${d.body}</p></${Reveal}>
            <form onSubmit=${(e) => { e.preventDefault(); setDone(true); }} class="mt-9 flex max-w-lg flex-col sm:flex-row gap-2 rounded-[28px] sm:rounded-full bg-white p-2">
              <label class="flex flex-1 items-center gap-3 px-4 text-graphite"><${Icon} n="pin" c="w-5 h-5 text-cyan-600" /><span class="sr-only">ZIP code or city</span><input value=${zip} onInput=${(e) => setZip(e.target.value)} placeholder="ZIP code or city" class="w-full bg-transparent py-3 text-[15px] outline-none placeholder:text-graphite/40" /></label>
              <button class="rounded-full bg-cyan px-6 py-3.5 text-[12px] font-semibold uppercase tracking-[0.14em] text-white hover:bg-cyan-600 transition">${done ? 'Searching…' : g.cta2.label}</button>
            </form>
            <div class="mt-6"><${Btn} href="#book" v="ghost">${g.cta.label}</${Btn}></div>
          </div>
          <div class="lg:col-span-5 flex lg:flex-col lg:items-end lg:justify-end flex-wrap gap-2">${d.badges.map((b) => html`<span key=${b} class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-4 py-2 text-[11px] font-semibold uppercase tracking-[0.16em] backdrop-blur"><${Icon} n="check" c="w-4 h-4 text-cyan-300" />${b}</span>`)}</div>
        </div>
      </div>
    </${Wrap}>
  </section>`;
};

/* ================================ Footer ================================ */
const Footer = ({ g }) => html`
  <footer class="bg-white pt-16 pb-8">
    <${Wrap}>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-10 border-t border-graphite/10 pt-14">
        <div class="md:col-span-4"><img src=${g.logo.dark} alt=${g.logo.alt} class="h-10 w-auto" /><p class="mt-5 max-w-xs text-[15px] leading-relaxed text-graphite/60">Personalized health, wellness and anti-aging — guided by data and reviewed by physicians.</p></div>
        <div class="md:col-span-8 grid grid-cols-2 sm:grid-cols-3 gap-8">${g.footer.map((c) => html`<div key=${c.title}><p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-graphite/45">${c.title}</p><ul class="mt-5 space-y-3">${c.links.map((l) => html`<li key=${l}><a href="#top" class="text-[14.5px] text-graphite/75 hover:text-cyan-600 transition-colors">${l}</a></li>`)}</ul></div>`)}</div>
      </div>
      <div class="mt-14 flex flex-col sm:flex-row justify-between gap-4 border-t border-graphite/10 pt-6 text-[13px] text-graphite/50">
        <p>© ${new Date().getFullYear()} Relive Health. All rights reserved.</p>
        <p>Free design preview by <a href="https://www.vocso.com" target="_blank" rel="noopener" class="font-semibold text-graphite hover:text-cyan-600">VOCSO</a></p>
      </div>
    </${Wrap}>
  </footer>`;

/* ================================ App =================================== */
const REGISTRY = {
  'sections.hero': Hero, 'sections.goals': Goals, 'sections.symptoms': Symptoms, 'sections.approach': Approach,
  'sections.biomarkers': Biomarkers, 'sections.journey': Journey, 'sections.compare': Compare,
  'sections.physicians': Physicians, 'sections.testimonials': Testimonials, 'sections.cta': CTA,
};
const App = () => html`
  <${MotionConfig} reducedMotion="user">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-white focus:px-4 focus:py-2">Skip to content</a>
    <${Header} g=${CMS.global} />
    <main id="main">${CMS.page.sections.map((s, i) => { const C = REGISTRY[s.__component]; return C ? html`<${C} key=${i} d=${s} g=${CMS.global} />` : null; })}</main>
    <${Footer} g=${CMS.global} />
  </${MotionConfig}>`;

createRoot(document.getElementById('root')).render(html`<${App} />`);
requestAnimationFrame(() => document.getElementById('boot')?.remove());
</script>
</body>
</html>
