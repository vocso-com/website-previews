/* ============================== Primitives ============================== */

  menu: 'M4 8h16M4 16h16',
  x: 'M18 6 6 18M6 6l12 12',
  plus: 'M12 5v14M5 12h14',

  clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
  insta: 'M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17.5 6.5h.01',

  right: 'M9 18l6-6-6-6',

const Icon = ({ name, className = 'w-5 h-5', sw = 1.5 }) => html`
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true"><path d=${ICONS[name]} /></svg>`;
const Stars = ({ className = 'w-4 h-4' }) => html`<span className="inline-flex gap-0.5 text-gold" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => html`<svg key=${i} viewBox="0 0 24 24" className=${className} fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z" /></svg>`)}</span>`;

const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 26 }, show: { opacity: 1, y: 0, transition: { duration: 0.9, ease } } };
const stagger = (s = 0.08, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };
const Reveal = ({ children, className = '', delay = 0 }) => html`
  <${motion.div} className=${className} ...${inView} variants=${{ hidden: { opacity: 0, y: 26 }, show: { opacity: 1, y: 0, transition: { duration: 0.9, ease, delay } } }}>${children}<//>`;
const Eyebrow = ({ children, dark }) => html`<div className=${`flex items-center gap-3 text-[11.5px] font-medium tracking-[0.34em] uppercase ${dark ? 'text-gold-dark' : 'text-gold'}`}><span className="w-8 h-px bg-current"></span>${children}</div>`;
const H2 = ({ children, className = '' }) => html`<h2 className=${`font-serif font-normal uppercase tracking-[0.02em] text-[40px] sm:text-[56px] lg:text-[72px] leading-[0.98] ${className}`}>${children}</h2>`;
const tel = `tel:${PHONE.replace(/\D/g, '')}`;

const Button = ({ href, children, variant = 'gold', className = '', icon = 'arrow', type, onClick }) => {
  const styles = {
    gold: 'bg-gold text-onyx-950 hover:bg-gold-light',
    ghost: 'ring-1 ring-white/35 text-white hover:bg-white hover:text-onyx-950',
    dark: 'bg-onyx-950 text-white hover:bg-onyx-800',
    outline: 'ring-1 ring-onyx/30 text-onyx hover:bg-onyx hover:text-white',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileTap=${{ scale: 0.97 }}
    className=${`group inline-flex items-center justify-center gap-3 px-8 h-[54px] text-[12px] font-medium tracking-[0.24em] uppercase whitespace-nowrap transition-colors duration-300 ${styles[variant]} ${className}`}>
    ${children}${icon && html`<${Icon} name=${icon} className="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" sw=${1.6} />`}
  <//>`;
};

/* ============================== Header ============================== */
const Header = ({ g }) => {
  const [scrolled, setScrolled] = useState(false);
  const [mega, setMega] = useState(false);
  const [open, setOpen] = useState(false);
  const { scrollY } = useScroll();
  useMotionValueEvent(scrollY, 'change', (v) => setScrolled(v > 60));
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
  return html`
  <header className="fixed top-0 inset-x-0 z-50" onMouseLeave=${() => setMega(false)}>
    <div className=${`transition-all duration-500 ${scrolled || mega ? 'bg-onyx-950/90 backdrop-blur-xl border-b border-white/10' : 'bg-gradient-to-b from-black/60 to-transparent border-b border-transparent'}`}>
      <div className=${`w-[92%] mx-auto flex items-center justify-between gap-6 transition-all duration-500 ${scrolled ? 'h-[76px]' : 'h-[100px]'}`}>
        <nav className="hidden xl:flex items-center gap-8 flex-1" aria-label="Primary">
          ${g.nav.slice(0, 3).map((n) => html`<a key=${n.label} href=${n.href} onMouseEnter=${() => setMega(!!n.mega)} aria-haspopup=${n.mega ? 'true' : undefined} aria-expanded=${n.mega ? mega : undefined} className="group relative h-10 flex items-center text-[11.5px] tracking-[0.28em] uppercase text-white/80 hover:text-white">${n.label}<span className="absolute left-0 right-0 bottom-1.5 h-px bg-gold origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></span></a>`)}
        </nav>
        <button onClick=${() => setOpen(true)} className="xl:hidden grid place-items-center w-11 h-11 text-white" aria-label="Open menu"><${Icon} name="menu" className="w-6 h-6" /></button>
        <a href="#" aria-label="ONYX Wellness & Aesthetics home" className="shrink-0"><img src=${g.logo.light} alt=${g.logo.alt} className=${`w-auto transition-all duration-500 ${scrolled ? 'h-12' : 'h-16'}`} /></a>
        <div className="flex items-center justify-end gap-8 flex-1">
          ${g.nav.slice(3).map((n) => html`<a key=${n.label} href=${n.href} className="hidden xl:flex group relative h-10 items-center text-[11.5px] tracking-[0.28em] uppercase text-white/80 hover:text-white">${n.label}<span className="absolute left-0 right-0 bottom-1.5 h-px bg-gold origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></span></a>`)}
          <${Button} href=${g.cta.href} className="hidden sm:inline-flex h-11 px-5 text-[11px]" icon=${null}>Book now<//>
        </div>
      </div>
      <${AnimatePresence}>
        ${mega && html`
          <${motion.div} key="mega" initial=${{ opacity: 0, y: -8 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0, transition: { duration: 0.15 } }} transition=${{ duration: 0.3, ease }} className="hidden xl:block absolute inset-x-0 top-full bg-onyx-950/95 backdrop-blur-xl border-b border-white/10">
            <div className="w-[92%] mx-auto py-10 grid grid-cols-6 gap-8">
              ${g.menu.map((c) => html`<div key=${c.name}><div className="text-[11px] tracking-[0.24em] uppercase text-gold mb-4">${c.name}</div><ul className="space-y-2.5">${c.items.map((i) => html`<li key=${i}><a href="#services" className="font-serif text-[18px] text-white/80 hover:text-white hover:italic transition-all">${i}</a></li>`)}</ul></div>`)}
            </div>
          <//>`}
      <//>
    </div>
    <${AnimatePresence}>
      ${open && html`
        <${motion.div} key="drawer" className="fixed inset-0 z-[60] bg-onyx-950 flex flex-col" initial=${{ clipPath: 'circle(0% at 40px 40px)' }} animate=${{ clipPath: 'circle(150% at 40px 40px)' }} exit=${{ clipPath: 'circle(0% at 40px 40px)' }} transition=${{ duration: 0.6, ease }}>
          <div className="flex items-center justify-between px-5 h-[100px]"><button onClick=${() => setOpen(false)} className="grid place-items-center w-11 h-11" aria-label="Close menu"><${Icon} name="x" className="w-6 h-6" /></button><img src=${g.logo.light} alt=${g.logo.alt} className="h-14" /><span className="w-11"></span></div>
          <${motion.nav} className="px-8 pt-6 flex-1 overflow-y-auto" variants=${stagger(0.06, 0.25)} initial="hidden" animate="show">
            ${g.nav.map((n) => html`<${motion.a} key=${n.label} variants=${fadeUp} href=${n.href} onClick=${() => setOpen(false)} className="flex items-center justify-between py-4 border-b border-white/10 font-serif uppercase text-[34px] tracking-[0.04em]">${n.label}<${Icon} name="arrowUR" className="w-5 h-5 text-gold" /><//>`)}
          <//>
          <div className="p-6 grid gap-3"><${Button} href="#contact" className="w-full" onClick=${() => setOpen(false)}>Book an appointment<//><${Button} href=${tel} variant="ghost" icon="phone" className="w-full">${PHONE}<//></div>
        <//>`}
    <//>
  </header>`;
};

/* ============================== Sections ============================== */

  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
  const scale = useTransform(scrollYProgress, [0, 1], [1, 1.12]);
  const yText = useTransform(scrollYProgress, [0, 1], [0, 140]);
  const fade = useTransform(scrollYProgress, [0, 0.7], [1, 0]);
  return html`
  <section ref=${ref} className="relative h-[100svh] min-h-[640px] overflow-hidden bg-onyx-950">
    <${motion.video} style=${{ scale }} className="absolute inset-0 w-full h-full object-cover" src=${d.video} poster=${d.poster} autoPlay muted loop playsInline preload="metadata" aria-hidden="true" />
    <div className="absolute inset-0 bg-black/45"></div>
    <div className="absolute inset-0 bg-gradient-to-t from-onyx-950 via-transparent to-black/40"></div>

        <span className="relative block w-full h-[0.9em] text-[48px] sm:text-[100px] lg:text-[140px] whitespace-nowrap overflow-hidden">
          <${AnimatePresence} mode="popLayout" initial=${false}>
            <${motion.span} key=${w} className="absolute inset-x-0 top-0" initial=${{ y: '100%', opacity: 0 }} animate=${{ y: 0, opacity: 1 }} exit=${{ y: '-100%', opacity: 0 }} transition=${{ duration: 0.8, ease }}>${d.words[w]}<//>
          <//>
        </span>
      </h1>
      <${motion.p} initial=${{ opacity: 0, y: 16 }} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: 0.9, ease, delay: 1 }} className="mt-8 max-w-xl text-[15.5px] leading-relaxed text-white/80 font-light">${d.body}<//>

        <${Button} href="#contact">Book an appointment<//><${Button} href="#about" variant="ghost" icon=${null}>Explore ONYX<//>
      <//>
    <//>
    <div className="absolute bottom-0 inset-x-0">
      <div className="w-[92%] mx-auto flex items-center justify-between gap-6 border-t border-white/15 py-5 text-[11.5px] tracking-[0.24em] uppercase text-white/70">
        <span className="flex items-center gap-3"><${Stars} className="w-3.5 h-3.5" /><span className="text-white">${d.rating.score}</span> ${d.rating.label}</span>
        <span className="hidden md:flex items-center gap-2"><${Icon} name="pin" className="w-4 h-4 text-gold" />Nashville, Tennessee</span>
        <a href="#about" className="flex items-center gap-3 hover:text-white">Scroll<${motion.span} animate=${{ y: [0, 5, 0] }} transition=${{ duration: 1.8, repeat: Infinity }} className="block w-px h-6 bg-gold" /></a>
