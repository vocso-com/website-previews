const Icon = ({ name, className = 'w-5 h-5', sw = 1.6 }) => html`
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.8, ease } } };
const stagger = (s = 0.07, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };
const Reveal = ({ children, className = '', delay = 0 }) => html`
  <${motion.div} className=${className} ...${inView} variants=${{ hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.8, ease, delay } } }}>${children}<//>`;

const Eyebrow = ({ children, light }) => html`
  <div className=${`flex items-center gap-3 text-[12px] font-medium tracking-[0.22em] uppercase ${light ? 'text-coral' : 'text-coral'}`}>
    <span className="relative w-2 h-2"><span className="absolute inset-0 bg-ksk-red rotate-45"></span></span>${children}
  </div>`;
const H2 = ({ children, className = '' }) => html`<h2 className=${`font-serif tracking-[-0.01em] text-[44px] sm:text-[58px] lg:text-[76px] leading-[0.98] ${className}`}>${children}</h2>`;

const Button = ({ href, children, variant = 'navy', className = '', icon = 'arrow', type, onClick }) => {
  const styles = {
    navy: 'bg-navy text-white hover:bg-navy-700',
    coral: 'bg-coral text-white hover:brightness-95',
    outline: 'ring-1 ring-navy/25 text-navy hover:ring-navy',
    ghost: 'ring-1 ring-white/30 text-white hover:bg-white hover:text-navy',
    white: 'bg-white text-navy hover:bg-cloud',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileTap=${{ scale: 0.98 }}
    className=${`group inline-flex items-center justify-center gap-3 rounded-full pl-6 ${icon ? 'pr-2' : 'pr-6'} h-[52px] text-[14.5px] font-medium whitespace-nowrap transition-colors duration-300 ${styles[variant]} ${className}`}>
    ${children}
    ${icon && html`<span className=${`grid place-items-center w-9 h-9 rounded-full transition-transform duration-300 group-hover:rotate-[-45deg] ${variant === 'navy' ? 'bg-coral text-white' : variant === 'coral' ? 'bg-white/20' : variant === 'white' ? 'bg-navy text-white' : 'bg-navy text-white'}`}><${Icon} name=${icon} className="w-4 h-4" sw=${1.8} /></span>`}
  <//>`;
};

/* ============================== Disclaimer ============================== */
const Disclaimer = ({ d }) => {
  const [open, setOpen] = useState(() => { try { return !sessionStorage.getItem('ksk-disclaimer'); } catch (e) { return true; } });
  const close = (v) => { try { sessionStorage.setItem('ksk-disclaimer', v); } catch (e) {} setOpen(false); };
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
  return html`<${AnimatePresence}>${open && html`
    <${motion.div} key="disc" className="fixed inset-0 z-[90] grid place-items-center p-4 bg-navy-950/60 backdrop-blur-sm" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }}>
      <${motion.div} role="dialog" aria-modal="true" aria-labelledby="disc-t" initial=${{ y: 30, opacity: 0, scale: 0.97 }} animate=${{ y: 0, opacity: 1, scale: 1 }} exit=${{ y: 20, opacity: 0 }} transition=${{ duration: 0.5, ease }}
        className="w-full max-w-[560px] bg-white rounded-[28px] p-8 sm:p-10 shadow-2xl">
        <img src="assets/logo.svg" alt="" className="h-7" />
        <h2 id="disc-t" className="mt-7 font-serif text-[36px] leading-none">${d.title}</h2>
        <p className="mt-4 text-[14.5px] leading-relaxed text-navy/70">${d.body}</p>

const Counter = ({ value, suffix = '' }) => {
  const ref = useRef(null);
  const [n, setN] = useState(0);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: 0, rootMargin: '0px 0px -10% 0px' });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  useEffect(() => {
    if (!seen) return;
    const c = animate(0, value, { duration: 1.6, ease, onUpdate: (v) => setN(Math.round(v)) });
    return () => c.stop();
  }, [seen]);
  return html`<span ref=${ref}>${n}${suffix}</span>`;
};
