/* ============================== Primitives ============================== */
const ICONS = {
  arrow: 'M5 12h14M12 5l7 7-7 7',
  arrowUR: 'M7 17 17 7M8 7h9v9',
  search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  menu: 'M4 7h16M4 12h16M4 17h16',
  x: 'M18 6 6 18M6 6l12 12',
  chevron: 'M6 9l6 6 6-6',
  check: 'M20 6 9 17l-5-5',
  pin: 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  globe: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20',
  quote: 'M7 7h4v4c0 3-2 5-4 6M15 7h4v4c0 3-2 5-4 6',
};
const Icon = ({ name, className = 'w-5 h-5', sw = 1.6 }) => html`
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.8, ease } } };
const stagger = (s = 0.07, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };
const Reveal = ({ children, className = '', delay = 0 }) => html`
  <${motion.div} className=${className} ...${inView} variants=${{ hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.8, ease, delay } } }}>${children}<//>`;

const Eyebrow = ({ children, light }) => html`
  <div className=${`flex items-center gap-3 text-[12px] font-medium tracking-[0.22em] uppercase ${light ? 'text-coral' : 'text-coral'}`}>
    <span className="relative w-2 h-2"><span className="absolute inset-0 bg-ksk-red rotate-45"></span></span>${children}
  </div>`;
const H2 = ({ children, className = '' }) => html`<h2 className=${`font-serif tracking-[-0.01em] text-[44px] sm:text-[58px] lg:text-[76px] leading-[0.98] ${className}`}>${children}</h2>`;

const Button = ({ href, children, variant = 'navy', className = '', icon = 'arrow', type, onClick }) => {
  const styles = {
    navy: 'bg-navy text-white hover:bg-navy-700',
    coral: 'bg-coral text-white hover:brightness-95',
    outline: 'ring-1 ring-navy/25 text-navy hover:ring-navy',
    ghost: 'ring-1 ring-white/30 text-white hover:bg-white hover:text-navy',
    white: 'bg-white text-navy hover:bg-ivory',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileTap=${{ scale: 0.98 }}
    className=${`group inline-flex items-center justify-center gap-3 rounded-full pl-6 ${icon ? 'pr-2' : 'pr-6'} h-[52px] text-[14.5px] font-medium whitespace-nowrap transition-colors duration-300 ${styles[variant]} ${className}`}>
    ${children}
    ${icon && html`<span className=${`grid place-items-center w-9 h-9 rounded-full transition-transform duration-300 group-hover:rotate-[-45deg] ${variant === 'navy' ? 'bg-coral text-white' : variant === 'coral' ? 'bg-white/20' : variant === 'white' ? 'bg-navy text-white' : 'bg-navy text-white'}`}><${Icon} name=${icon} className="w-4 h-4" sw=${1.8} /></span>`}
  <//>`;
};

/* ============================== Disclaimer ============================== */
const Disclaimer = ({ d }) => {
  const [open, setOpen] = useState(() => { try { return !sessionStorage.getItem('ksk-disclaimer'); } catch (e) { return true; } });
  const close = (v) => { try { sessionStorage.setItem('ksk-disclaimer', v); } catch (e) {} setOpen(false); };
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
  return html`<${AnimatePresence}>${open && html`
    <${motion.div} key="disc" className="fixed inset-0 z-[90] grid place-items-center p-4 bg-navy-950/60 backdrop-blur-sm" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }}>
      <${motion.div} role="dialog" aria-modal="true" aria-labelledby="disc-t" initial=${{ y: 30, opacity: 0, scale: 0.97 }} animate=${{ y: 0, opacity: 1, scale: 1 }} exit=${{ y: 20, opacity: 0 }} transition=${{ duration: 0.5, ease }}
        className="w-full max-w-[560px] bg-white rounded-[28px] p-8 sm:p-10 shadow-2xl">
        <img src="assets/logo.svg" alt="" className="h-7" />
        <h2 id="disc-t" className="mt-7 font-serif text-[36px] leading-none">${d.title}</h2>
        <p className="mt-4 text-[14.5px] leading-relaxed text-navy/70">${d.body}</p>
        <div className="mt-8 flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
          <${Button} variant="outline" icon=${null} onClick=${() => close('rejected')}>Reject all<//>
          <${Button} onClick=${() => close('accepted')} icon="check">Accept all<//>
        </div>
      <//>
    <//>`}<//>`;
};

/* ============================== Header ============================== */
const Header = ({ g, areas }) => {
  const [scrolled, setScrolled] = useState(false);
  const [mega, setMega] = useState(false);
  const [open, setOpen] = useState(false);
  const { scrollY } = useScroll();
  useMotionValueEvent(scrollY, 'change', (v) => setScrolled(v > 30));
  return html`
  <header className="sticky top-0 z-50" onMouseLeave=${() => setMega(false)}>
    <div className=${`transition-all duration-300 ${scrolled || mega ? 'bg-ivory/90 backdrop-blur-xl border-b border-line' : 'bg-ivory border-b border-transparent'}`}>
      <div className=${`max-w-site mx-auto px-5 lg:px-10 flex items-center justify-between gap-6 transition-all duration-300 ${scrolled ? 'h-[68px]' : 'h-[86px]'}`}>
        <a href="#" aria-label="King Stubb & Kasiva home" className="shrink-0"><img src=${g.logo.url} alt=${g.logo.alt} className=${`w-auto transition-all duration-300 ${scrolled ? 'h-7' : 'h-8 sm:h-9'}`} /></a>
        <nav className="hidden xl:flex items-center gap-1 rounded-full bg-white/70 ring-1 ring-line p-1" aria-label="Primary">
          ${g.nav.map((n) => html`
            <a key=${n.label} href=${n.href} onMouseEnter=${() => setMega(!!n.mega)} aria-haspopup=${n.mega ? 'true' : undefined} aria-expanded=${n.mega ? mega : undefined}
              className="relative flex items-center gap-1 h-10 px-4 rounded-full text-[14.5px] text-navy/75 hover:text-navy transition-colors whitespace-nowrap">
              ${n.label}${n.mega && html`<${Icon} name="chevron" className=${`w-3.5 h-3.5 transition-transform ${mega ? 'rotate-180' : ''}`} />`}
            </a>`)}
        </nav>
        <div className="flex items-center gap-2">
          <a href="#" className="hidden md:grid place-items-center w-11 h-11 rounded-full ring-1 ring-line hover:ring-navy/40 transition" aria-label="Search the site"><${Icon} name="search" className="w-[18px] h-[18px]" /></a>
          <${Button} href=${g.cta.href} className="hidden sm:inline-flex h-11" icon="arrowUR">${g.cta.label}<//>
          <button onClick=${() => setOpen(true)} className="xl:hidden grid place-items-center w-11 h-11 rounded-full bg-navy text-white" aria-label="Open menu"><${Icon} name="menu" /></button>
        </div>
      </div>
    </div>
    <${AnimatePresence}>
      ${mega && html`
        <${motion.div} key="mega" initial=${{ opacity: 0, y: -8 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0, transition: { duration: 0.15 } }} transition=${{ duration: 0.3, ease }}
          className="hidden xl:block absolute inset-x-0 top-full bg-white border-b border-line shadow-[0_40px_60px_-40px_rgba(14,52,83,.35)]">
          <div className="max-w-site mx-auto px-10 py-10 grid grid-cols-[1fr_340px] gap-12">
            <ul className="grid grid-cols-3 gap-x-10 gap-y-1">
              ${areas.map((a, i) => html`<${motion.li} key=${a.name} initial=${{ opacity: 0, y: 8 }} animate=${{ opacity: 1, y: 0 }} transition=${{ delay: i * 0.015 }}><a href="#expertise" className="group flex items-center justify-between py-2.5 border-b border-line text-[15px] hover:text-coral transition-colors">${a.name}<${Icon} name="arrow" className="w-4 h-4 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all" /></a><//>`)}
            </ul>
            <div className="rounded-3xl bg-navy text-white p-7 flex flex-col">
              <div className="text-[12px] tracking-[0.2em] uppercase text-coral">Featured</div>
              <div className="mt-3 font-serif text-[30px] leading-tight">Data Privacy & the DPDP Act</div>
              <p className="mt-3 text-[14px] text-white/65">Consent, cross-border transfers and compliance programs for India’s new privacy regime.</p>
              <a href="#insights" className="mt-auto pt-6 inline-flex items-center gap-2 text-[14px] font-medium text-white">Read insights <${Icon} name="arrow" className="w-4 h-4" /></a>
            </div>
          </div>
        <//>`}
    <//>
    <${AnimatePresence}>
      ${open && html`
        <${motion.div} key="drawer" className="fixed inset-0 z-[60] bg-navy text-white flex flex-col" initial=${{ y: '-100%' }} animate=${{ y: 0 }} exit=${{ y: '-100%' }} transition=${{ duration: 0.55, ease }}>
          <div className="flex items-center justify-between px-5 h-[86px]">
            <img src=${g.logo.urlLight} alt=${g.logo.alt} className="h-8" />
            <button onClick=${() => setOpen(false)} className="grid place-items-center w-11 h-11 rounded-full bg-white/10" aria-label="Close menu"><${Icon} name="x" /></button>
          </div>
          <${motion.nav} className="px-6 pt-4 flex-1 overflow-y-auto" variants=${stagger(0.05, 0.25)} initial="hidden" animate="show">
            ${[...g.nav, g.cta].map((n) => html`<${motion.a} key=${n.label} variants=${fadeUp} href=${n.href} onClick=${() => setOpen(false)} className="flex items-center justify-between py-4 border-b border-white/10 font-serif text-[38px]">${n.label}<${Icon} name="arrowUR" className="w-6 h-6 text-coral" /><//>`)}
          <//>
        <//>`}
    <//>
  </header>`;
};

/* ============================== Sections ============================== */
const Hero = ({ d }) => {
  const [w, setW] = useState(0);
  useEffect(() => { const t = setInterval(() => setW((x) => (x + 1) % d.rotating.length), 2800); return () => clearInterval(t); }, []);
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
  const scale = useTransform(scrollYProgress, [0, 1], [1, 1.12]);
  return html`
  <section ref=${ref} className="relative">
    <div className="max-w-site mx-auto px-5 lg:px-10 pt-10 lg:pt-16">
      <${motion.div} variants=${stagger(0.1, 0.1)} initial="hidden" animate="show" className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
        <div className="lg:col-span-8">
          <${motion.div} variants=${fadeUp}><${Eyebrow}>${d.kicker}<//><//>
          <h1 className="mt-6 font-serif text-[52px] sm:text-[80px] lg:text-[108px] leading-[0.95] tracking-[-0.02em]">
            <${motion.span} variants=${fadeUp} className="block">${d.lead}</${motion.span}>

                    <div><label htmlFor="c-name" className="block text-[12.5px] text-white/60 mb-1.5">Full name</label><input id="c-name" required autoComplete="name" className=${field} /></div>
                    <div><label htmlFor="c-org" className="block text-[12.5px] text-white/60 mb-1.5">Organisation</label><input id="c-org" autoComplete="organization" className=${field} /></div>

                  <${Button} type="submit" variant="white" className="mt-2 w-full sm:w-auto sm:justify-self-start">Send enquiry<//>
                <//>`}
            <//>
          </div>

    </div>
  </section>`;
};
