const Button = ({ href, children, variant = 'ink', className = '', icon = 'arrow', type, onClick }) => {

    ghost: 'ring-1 ring-cream/40 text-cream hover:bg-cream hover:text-ink',

  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileTap=${{ scale: 0.97 }}

/* ============================== Cart (demo) ============================== */
const CartCtx = createContext({ count: 0, add: () => {} });
const CartProvider = ({ children }) => {
  const [count, setCount] = useState(0);
  const [toast, setToast] = useState(null);
  const add = (name) => { setCount((c) => c + 1); setToast({ name, id: Date.now() }); };
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);
  return html`<${CartCtx.Provider} value=${{ count, add }}>
    ${children}
    <${AnimatePresence}>${toast && html`
      <${motion.div} key=${toast.id} role="status" initial=${{ opacity: 0, y: 40, scale: 0.96 }} animate=${{ opacity: 1, y: 0, scale: 1 }} exit=${{ opacity: 0, y: 20 }} transition=${{ type: 'spring', stiffness: 300, damping: 26 }}
        className="fixed z-[70] bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 flex items-center gap-3 bg-ink text-cream pl-3 pr-5 py-3 shadow-2xl">
        <span className="grid place-items-center w-9 h-9 bg-nude text-ink"><${Icon} name="check" className="w-4 h-4" sw=${2.2} /></span>
        <span className="text-[14px]"><span className="opacity-70">Added</span> ${toast.name}</span>
      <//>`}<//>
  <//>`;
};

            <figcaption className="mt-auto pt-7 flex items-center gap-3"><img src=${r.image} alt="" loading="lazy" className="w-11 h-11 rounded-full object-cover" /><span className="text-[12.5px] tracking-[0.16em] uppercase">${r.who}<span className="block normal-case tracking-normal text-ink/50 text-[12.5px]">Verified client</span></span></figcaption>
          <//>`)}
      <//>
      <p className="mt-6 text-[12.5px] text-ink/40">${d.note}</p>
    </div>
  </section>`;

const BookCta = ({ d }) => {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start end', 'end start'] });
  const y = useTransform(scrollYProgress, [0, 1], ['-12%', '12%']);
  return html`
  <section ref=${ref} className="relative h-[560px] lg:h-[680px] overflow-hidden on-dark">
    <${motion.img} style=${{ y }} src=${d.image} alt="" loading="lazy" className="absolute inset-0 w-full h-[124%] -top-[12%] object-cover" />
    <div className="absolute inset-0 bg-ink/55"></div>
    <div className="relative h-full max-w-site mx-auto px-5 lg:px-10 flex flex-col items-center justify-center text-center text-cream">
      <${Reveal}>
        <div className="font-script text-[44px] sm:text-[56px] text-nude leading-none">${d.script}</div>
        <h2 className="mt-2 font-display uppercase text-[64px] sm:text-[100px] lg:text-[136px] leading-[0.86] max-w-5xl">${d.title}</h2>
        <div className="mt-10"><${Button} href=${d.cta.href} variant="cream" className="h-14 px-10">${d.cta.label}<//></div>
      <//>
    </div>
  </section>`;
};

const Footer = ({ g }) => {
  const [sent, setSent] = useState(false);
  return html`
  <footer className="bg-ink text-cream/70 on-dark">
    <div className="max-w-site mx-auto px-5 lg:px-10 pt-20 pb-10">
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 pb-14 border-b border-cream/10">
        <div className="lg:col-span-5">
          <img src=${g.logo.url} alt=${g.logo.alt} className="h-8 w-auto logo-light" loading="lazy" />
          <p className="mt-8 font-display uppercase text-[40px] leading-[0.95] text-cream">Join the club.<br />Get offers first.</p>
          <${AnimatePresence} mode="wait">
            ${sent ? html`<${motion.p} key="ok" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} className="mt-6 inline-flex items-center gap-2 text-nude"><${Icon} name="check" className="w-4 h-4" sw=${2} />You’re on the list.<//>`
            : html`<${motion.form} key="f" exit=${{ opacity: 0 }} onSubmit=${(e) => { e.preventDefault(); setSent(true); }} className="mt-6 flex max-w-md border-b border-cream/30 focus-within:border-nude transition-colors">
                <label htmlFor="fem" className="sr-only">Email</label>
                <input id="fem" type="email" required autoComplete="email" placeholder="Email address" className="flex-1 min-w-0 h-12 bg-transparent text-[15px] text-cream placeholder:text-cream/40 focus:outline-none" />
                <button type="submit" className="px-2 text-[12px] tracking-[0.2em] uppercase text-cream hover:text-nude">Subscribe →</button>
              <//>`}
          <//>
        </div>
        <div className="lg:col-span-7 grid grid-cols-2 sm:grid-cols-3 gap-8">
          ${g.footer.columns.map((c) => html`
            <div key=${c.title}>
              <div className="text-[11.5px] tracking-[0.26em] uppercase text-nude mb-5">${c.title}</div>
              <ul className="space-y-3 text-[14.5px] font-light">${c.links.map((l) => html`<li key=${l}><a href="#" className="hover:text-cream transition-colors">${l}</a></li>`)}</ul>
            </div>`)}
        </div>
      </div>
      <div className="pt-8 flex flex-col md:flex-row gap-4 justify-between text-[12.5px] text-cream/45">
        <p>© 2026 NakedMD <span className="mx-2 text-cream/20">|</span>Free design preview by <a href="https://www.vocso.com" target="_blank" rel="noopener" className="text-cream/75 font-medium hover:text-cream underline-offset-4 hover:underline">VOCSO</a></p>
        <div className="flex flex-wrap gap-5">${['Instagram', 'TikTok', 'Facebook', 'YouTube'].map((s) => html`<a key=${s} href="#" className="hover:text-cream transition-colors">${s}</a>`)}</div>
      </div>
    </div>
  </footer>`;
};

const REGISTRY = {
  'sections.hero': Hero,
  'sections.pillars': Pillars,
  'sections.product-grid': ProductGrid,
  'sections.offers': Offers,
  'sections.area-explorer': AreaExplorer,
  'sections.studios': Studios,
  'sections.perks': Perks,
  'sections.reviews': Reviews,
  'sections.book-cta': BookCta,
};

const App = () => html`
  <${MotionConfig} reducedMotion="user">
    <${CartProvider}>
      <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100] focus:bg-ink focus:text-cream focus:px-4 focus:py-2">Skip to content</a>
