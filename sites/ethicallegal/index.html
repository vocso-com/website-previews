const stagger = (s = 0.07, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };

const Button = ({ href, children, variant = 'navy', className = '', icon = 'arrow', type, onClick }) => {

  <//>`;
};

const Counter = ({ value, suffix = '' }) => {
  const ref = useRef(null);
  const [n, setN] = useState(0);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: 0, rootMargin: '0px 0px -10% 0px' });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  useEffect(() => { if (!seen) return; const c = animate(0, value, { duration: 1.6, ease, onUpdate: (v) => setN(Math.round(v)) }); return () => c.stop(); }, [seen]);
  return html`<span ref=${ref}>${n}${suffix}</span>`;
};

/* ============================== Disclaimer ============================== */
const Disclaimer = ({ d }) => {
  const [open, setOpen] = useState(() => { try { return !sessionStorage.getItem('el-disclaimer'); } catch (e) { return true; } });

  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
  return html`<${AnimatePresence}>${open && html`
    <${motion.div} key="disc" className="fixed inset-0 z-[90] grid place-items-center p-4 bg-navy-950/70 backdrop-blur-sm" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }}>
      <${motion.div} role="dialog" aria-modal="true" aria-labelledby="disc-t" initial=${{ y: 30, opacity: 0, scale: 0.97 }} animate=${{ y: 0, opacity: 1, scale: 1 }} exit=${{ y: 20, opacity: 0 }} transition=${{ duration: 0.5, ease }}
        className="w-full max-w-[560px] bg-white rounded-[28px] p-8 sm:p-10 shadow-2xl">
        <img src="assets/logo.png" alt="" className="h-9" />
        <h2 id="disc-t" className="mt-7 font-serif text-[40px] leading-none">${d.title}</h2>
        <p className="mt-4 text-[14.5px] leading-relaxed text-navy/70">${d.body}</p>
        <div className="mt-8 flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">

          <${Button} onClick=${() => close('agreed')} icon="check">I agree<//>
        </div>
      <//>
    <//>`}<//>`;
};
