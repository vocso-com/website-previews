  chevron: 'M6 9l6 6 6-6',
  left: 'M15 18l-6-6 6-6',
  right: 'M9 18l6-6-6-6',
  clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
  check: 'M20 6 9 17l-5-5',
  bag: 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0',
  user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  plus: 'M12 5v14M5 12h14',
  sparkle: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z',
  gift: 'M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z',
};
const Icon = ({ name, className = 'w-5 h-5', sw = 1.6 }) => html`
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 26 }, show: { opacity: 1, y: 0, transition: { duration: 0.8, ease } } };
const stagger = (s = 0.08, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };

const Reveal = ({ children, className = '', delay = 0 }) => html`
  <${motion.div} className=${className} ...${inView}
    variants=${{ hidden: { opacity: 0, y: 26 }, show: { opacity: 1, y: 0, transition: { duration: 0.8, ease, delay } } }}>${children}<//>`;

const Eyebrow = ({ children, className = '' }) => html`<div className=${`text-[11.5px] font-medium tracking-[0.28em] uppercase ${className}`}>${children}</div>`;
const H2 = ({ children, className = '' }) => html`<h2 className=${`font-serif font-light tracking-[-0.02em] text-[38px] sm:text-[50px] lg:text-[64px] leading-[1.02] ${className}`}>${children}</h2>`;

const Button = ({ href, children, variant = 'forest', className = '', icon = 'arrow', type, onClick }) => {
  const styles = {
    forest: 'bg-forest text-cream hover:bg-forest-700',
    lime: 'bg-lime text-forest hover:brightness-95',
    light: 'bg-white text-forest hover:bg-lilac-50 ring-1 ring-forest/10',
    outline: 'ring-1 ring-forest/25 text-forest hover:bg-forest hover:text-cream',
    ghost: 'ring-1 ring-cream/30 text-cream hover:bg-cream hover:text-forest',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileTap=${{ scale: 0.97 }}
    className=${`group inline-flex items-center justify-center gap-2.5 rounded-full px-7 h-12 text-[13px] font-medium tracking-[0.14em] uppercase whitespace-nowrap transition-colors duration-300 ${styles[variant]} ${className}`}>
    ${children}${icon && html`<span className="relative w-4 h-4 overflow-hidden"><span className="absolute inset-0 transition-transform duration-300 group-hover:translate-x-5"><${Icon} name=${icon} className="w-4 h-4" sw=${1.8} /></span><span className="absolute inset-0 -translate-x-5 transition-transform duration-300 group-hover:translate-x-0"><${Icon} name=${icon} className="w-4 h-4" sw=${1.8} /></span></span>`}
  <//>`;
};

/* ============================== Header ============================== */

      <a href=${d.href} className="font-medium text-lime hover:underline underline-offset-4">View →</a>

  <header className="sticky top-0 z-50" onMouseLeave=${() => { setMega(false); setHover(null); }}>
    <div className=${`relative transition-all duration-300 ${scrolled || mega ? 'bg-cream/90 backdrop-blur-xl shadow-[0_10px_30px_-20px_rgba(16,49,43,.35)]' : 'bg-cream'}`}>

        <nav className="hidden xl:flex items-center gap-1" aria-label="Primary">

              ${hover === i && html`<${motion.span} layoutId="nav-line" className="absolute left-3.5 right-3.5 bottom-1 h-px bg-forest" transition=${{ type: 'spring', stiffness: 420, damping: 34 }} />`}

        </nav>
        <button onClick=${() => setOpen(true)} className="xl:hidden justify-self-start grid place-items-center w-11 h-11 rounded-full ring-1 ring-forest/15" aria-label="Open menu"><${Icon} name="menu" /></button>
        <a href="#" className="justify-self-center" aria-label="SkinSpirit home"><img src=${g.logo.url} alt=${g.logo.alt} className=${`w-auto transition-all duration-300 ${scrolled ? 'h-[18px]' : 'h-[21px] sm:h-6'}`} /></a>
        <div className="justify-self-end flex items-center gap-2">
          ${g.nav.slice(4).map((n) => html`<a key=${n.label} href=${n.href} className="hidden xl:inline-flex px-3 h-10 items-center text-[12.5px] tracking-[0.16em] uppercase hover:opacity-60 transition-opacity">${n.label}</a>`)}
          <a href="#" className="hidden md:grid place-items-center w-10 h-10 rounded-full hover:bg-forest/5" aria-label="Search treatments"><${Icon} name="search" className="w-[18px] h-[18px]" /></a>
          <a href="#" className="hidden md:grid place-items-center w-10 h-10 rounded-full hover:bg-forest/5" aria-label="Account"><${Icon} name="user" className="w-[18px] h-[18px]" /></a>
          <${Button} href=${g.cta.href} className="h-10 px-5 text-[12px]" icon=${null}>${g.cta.label}<//>
        </div>
      </div>
      <${AnimatePresence}>
        ${mega && html`
          <${motion.div} key="mega" initial=${{ opacity: 0, y: -6 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0, transition: { duration: 0.15 } }} transition=${{ duration: 0.3, ease }}
            className="hidden xl:block absolute inset-x-0 top-full bg-cream border-t border-forest/10 shadow-[0_40px_60px_-40px_rgba(16,49,43,.4)]">
            <div className="max-w-site mx-auto px-10 py-10 grid grid-cols-[repeat(4,1fr)_300px] gap-8">
              ${treat.map((c, ci) => html`
                <${motion.div} key=${c.heading} initial=${{ opacity: 0, y: 10 }} animate=${{ opacity: 1, y: 0 }} transition=${{ delay: ci * 0.05, duration: 0.4, ease }}>
                  <${Eyebrow} className="text-forest/50 mb-4">${c.heading}<//>

                <//>`)}

                <img src=${img('photo-1570172619644-dfd03ed5d881', 600)} alt="" className="absolute inset-0 w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-forest/80 to-transparent"></div>
                <div className="absolute left-5 bottom-5 right-5 text-cream"><div className="font-script text-3xl text-lime">not sure where to start?</div><a href="#locations" className="mt-2 inline-flex items-center gap-2 text-[12px] tracking-[0.16em] uppercase">Book a consult <${Icon} name="arrow" className="w-4 h-4" /></a></div>
