<script type="module">

const html = htm.bind(React.createElement);

   ========================================================================== */

const VIDEO = 'https://viomedspa.com/wp-content/uploads/2026/11/Homepage-Hero.mp4';

          { name: 'Skin', line: 'Facials, peels, and microneedling', image: A('img/skin.jpg'), list: ['Hydrafacial', 'DiamondGlow', 'Glo2Facial', 'Morpheus8', 'SkinPen', 'HALO Laser', 'BBL + MOXI', 'IPL Therapy'] },
          { name: 'Body', line: 'Contouring, skin tightening, and sculpting', image: A('img/body.jpg'), list: ['Body contouring', 'Skin tightening', 'Sculpting', 'Laser hair removal', 'Scalp restoration'] },
          { name: 'Wellness', line: 'Weight loss, peptides, and hormone health', image: A('img/wellness.jpg'), list: ['Weight & metabolic health', 'Peptide therapy', 'Hormone support', 'Nutrient therapy'] },

          ['Comfort', 'They made me feel so comfortable from the minute I walked through the doors! I truly look forward to every visit!!!', 'Jade', 'Toledo, OH'],
          ['Loyalty', 'Liz the injector is AMAZING and Natasha the Esthetician is equally AMAZING. I found my forever place at VIO Med Spa.', 'Tammy', 'Jacksonville, FL'],

          ['Expertise', 'My Morpheus8 treatment was the best thing I’ve done for my skin lately. They educate you on the entire process.', 'Lamees', 'McKinney, TX'],
          ['First Impressions', 'The spa is clean, relaxing and beautifully designed. The staff truly cares about your comfort and results.', 'Lori', 'Huntersville, NC'],
        ],
      },
      {
        __component: 'sections.clubvio',
        id: 'clubvio',
        eyebrow: 'ClubVIO',

        perks: [
          { title: 'Bank monthly', body: 'Your balance builds each month and is always yours to use.' },
          { title: 'Preferred rates', body: 'Member pricing on specialized care.' },
          { title: 'First access', body: 'Member events and preferred partners.' },
        ],

      {

        note: '* Financing availability and terms vary by location.',
        partners: [{ name: 'Cherry' }, { name: 'PatientFi', logo: A('img/patientFi.svg') }, { name: 'CareCredit', logo: A('img/care-credit.svg') }],

/* ============================== Primitives ============================== */
const ICONS = {
  arrow: 'M5 12h14M12 5l7 7-7 7',
  arrowUR: 'M7 17 17 7M8 7h9v9',
  menu: 'M4 8h16M4 16h16',
  x: 'M18 6 6 18M6 6l12 12',
  plus: 'M12 5v14M5 12h14',
  check: 'M20 6 9 17l-5-5',
  pin: 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  play: 'M7 4l13 8-13 8z',
  pause: 'M7 4h3v16H7zM14 4h3v16h-3z',
  left: 'M15 18l-6-6 6-6',
  right: 'M9 18l6-6-6-6',
  insta: 'M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17.5 6.5h.01',
};
const Icon = ({ name, className = 'w-5 h-5', sw = 1.5 }) => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.85, ease } } };
const stagger = (s = 0.08, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };
const Reveal = ({ children, className = '', delay = 0 }) => html`<${motion.div} className=${className} ...${inView} variants=${{ hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.85, ease, delay } } }}>${children}<//>`;
const Eyebrow = ({ children, light }) => html`<div className=${`text-[11.5px] font-medium tracking-[0.3em] uppercase ${light ? 'text-sand' : 'text-slate-600'}`}>${children}</div>`;
const H2 = ({ children, className = '' }) => html`<h2 className=${`font-display font-semibold tracking-[-0.03em] text-[38px] sm:text-[52px] lg:text-[68px] leading-[0.98] ${className}`}>${children}</h2>`;

const Button = ({ href, children, variant = 'ink', className = '', icon = 'arrow', type, onClick }) => {
  const styles = {
    ink: 'bg-ink text-cream hover:bg-slate-800',
    cream: 'bg-cream text-ink hover:bg-sand',
    slate: 'bg-slate-600 text-white hover:bg-slate-800',
    outline: 'ring-1 ring-ink/25 text-ink hover:bg-ink hover:text-cream',
    ghost: 'ring-1 ring-white/40 text-white hover:bg-white hover:text-ink',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileTap=${{ scale: 0.97 }}
    className=${`group inline-flex items-center justify-center gap-3 rounded-full px-7 h-[52px] text-[12.5px] font-medium tracking-[0.18em] uppercase whitespace-nowrap transition-colors duration-300 ${styles[variant]} ${className}`}>
    ${children}${icon && html`<${Icon} name=${icon} className="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" sw=${1.7} />`}
  <//>`;
};

const FindVio = ({ dark, className = '' }) => {
  const [q, setQ] = useState('');
  const [done, setDone] = useState(false);
  return html`<div className=${className}>
    <form onSubmit=${(e) => { e.preventDefault(); setDone(true); }} className=${`flex items-center gap-2 rounded-full p-1.5 pl-5 ${dark ? 'bg-white/10 ring-1 ring-white/25 backdrop-blur' : 'bg-white ring-1 ring-ink/10 shadow-[0_20px_40px_-30px_rgba(36,32,29,.5)]'}`}>
      <${Icon} name="pin" className=${`w-5 h-5 shrink-0 ${dark ? 'text-sand' : 'text-slate-600'}`} />
      <label className="flex-1 min-w-0"><span className="sr-only">City, state or ZIP</span><input value=${q} onChange=${(e) => { setQ(e.target.value); setDone(false); }} placeholder="City, state or ZIP" autoComplete="postal-code" className=${`w-full h-11 bg-transparent text-[15px] focus:outline-none ${dark ? 'text-white placeholder:text-white/55' : 'placeholder:text-ink/40'}`} /></label>
      <button type="submit" className=${`h-11 px-5 rounded-full text-[12px] font-medium tracking-[0.18em] uppercase whitespace-nowrap ${dark ? 'bg-cream text-ink' : 'bg-ink text-cream'}`}>Find your VIO</button>
    </form>
    <${AnimatePresence}>${done && html`<${motion.p} initial=${{ opacity: 0, y: -4 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0 }} className=${`mt-3 pl-5 text-[13.5px] ${dark ? 'text-white/80' : 'text-ink/60'}`}>Showing VIO locations near <strong className="font-medium">${q || 'you'}</strong> — connected to the live locations API in production.<//>`}<//>
  </div>`;
};

/* ============================== Header ============================== */
const Header = ({ g, cats }) => {
  const [scrolled, setScrolled] = useState(false);
  const [mega, setMega] = useState(false);
  const [open, setOpen] = useState(false);
  const { scrollY } = useScroll();
  useMotionValueEvent(scrollY, 'change', (v) => setScrolled(v > 30));
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
  return html`
  <header className="sticky top-0 z-50" onMouseLeave=${() => setMega(false)}>
    <div className="bg-ink text-cream text-[12px] tracking-[0.2em] uppercase"><div className="h-9 flex items-center justify-center gap-3 px-4 text-center"><span>${g.promo.text}</span><a href=${g.promo.href} className="underline underline-offset-4 decoration-taupe hover:text-sand">${g.promo.link}</a></div></div>
    <div className=${`transition-all duration-300 ${scrolled || mega ? 'bg-cream/90 backdrop-blur-xl border-b border-ink/10' : 'bg-cream border-b border-transparent'}`}>
      <div className=${`w-[92%] mx-auto flex items-center justify-between gap-6 transition-all duration-300 ${scrolled ? 'h-[66px]' : 'h-[82px]'}`}>
        <a href="#" aria-label="VIO Med Spa home"><img src=${g.logo.dark} alt=${g.logo.alt} className=${`w-auto transition-all duration-300 ${scrolled ? 'h-7' : 'h-9'}`} /></a>
        <nav className="hidden xl:flex items-center gap-8" aria-label="Primary">
          ${g.nav.map((n) => html`<a key=${n.label} href=${n.href} onMouseEnter=${() => setMega(!!n.mega)} aria-haspopup=${n.mega ? 'true' : undefined} aria-expanded=${n.mega ? mega : undefined} className="group relative h-10 flex items-center text-[12.5px] tracking-[0.2em] uppercase text-ink/75 hover:text-ink">${n.label}<span className="absolute left-0 right-0 bottom-2 h-px bg-ink origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></span></a>`)}
        </nav>
        <div className="flex items-center gap-2">
          <${Button} href=${g.cta.href} className="hidden sm:inline-flex h-11 px-6 text-[11.5px]" icon="pin">${g.cta.label}<//>
          <button onClick=${() => setOpen(true)} className="xl:hidden grid place-items-center w-11 h-11 rounded-full ring-1 ring-ink/15" aria-label="Open menu"><${Icon} name="menu" /></button>
        </div>
      </div>
      <${AnimatePresence}>
        ${mega && html`
          <${motion.div} key="mega" initial=${{ opacity: 0, y: -8 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0, transition: { duration: 0.15 } }} transition=${{ duration: 0.3, ease }} className="hidden xl:block absolute inset-x-0 top-full bg-cream border-b border-ink/10 shadow-[0_40px_60px_-40px_rgba(36,32,29,.35)]">
            <div className="w-[92%] mx-auto py-10 grid grid-cols-4 gap-6">
              ${cats.map((c) => html`<a key=${c.name} href="#treatments" className="group block"><div className="relative aspect-[4/3] rounded-2xl overflow-hidden"><img src=${c.image} alt="" className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" /></div>
                <div className="mt-3 flex items-center justify-between"><span className="font-display text-[20px] font-semibold">${c.name}</span><${Icon} name="arrowUR" className="w-4 h-4 text-slate-600" /></div><p className="text-[13px] text-ink/55">${c.line}</p></a>`)}
            </div>
          <//>`}
      <//>
    </div>
    <${AnimatePresence}>
      ${open && html`
        <${motion.div} key="drawer" className="fixed inset-0 z-[60] bg-cream flex flex-col" initial=${{ y: '-100%' }} animate=${{ y: 0 }} exit=${{ y: '-100%' }} transition=${{ duration: 0.5, ease }}>
          <div className="flex items-center justify-between px-5 h-[82px]"><img src=${g.logo.dark} alt=${g.logo.alt} className="h-8" /><button onClick=${() => setOpen(false)} className="grid place-items-center w-11 h-11 rounded-full ring-1 ring-ink/15" aria-label="Close menu"><${Icon} name="x" /></button></div>
          <${motion.nav} className="px-6 pt-4 flex-1 overflow-y-auto" variants=${stagger(0.05, 0.2)} initial="hidden" animate="show">
            ${g.nav.map((n) => html`<${motion.a} key=${n.label} variants=${fadeUp} href=${n.href} onClick=${() => setOpen(false)} className="flex items-center justify-between py-4 border-b border-ink/10 font-display font-semibold text-[34px] tracking-[-0.02em]">${n.label}<${Icon} name="arrowUR" className="w-5 h-5 text-slate-600" /><//>`)}
          <//>
          <div className="p-6"><${FindVio} /></div>
        <//>`}
    <//>
  </header>`;
};

/* ============================== Sections ============================== */
const Hero = ({ d }) => {
  const ref = useRef(null);
  const vid = useRef(null);
  const [playing, setPlaying] = useState(true);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
  const inset = useTransform(scrollYProgress, [0, 1], ['0px', '48px']);
  const radius = useTransform(scrollYProgress, [0, 1], ['28px', '56px']);
  const toggle = () => { const v = vid.current; if (!v) return; if (v.paused) { v.play(); setPlaying(true); } else { v.pause(); setPlaying(false); } };
  return html`
  <section ref=${ref} className="relative bg-cream px-3 sm:px-5 pb-6">
    <${motion.div} style=${{ marginLeft: inset, marginRight: inset, borderRadius: radius }} className="relative h-[calc(100svh-140px)] min-h-[560px] overflow-hidden bg-sand">
      <video ref=${vid} className="absolute inset-0 w-full h-full object-cover" src=${d.video} poster=${d.poster} autoPlay muted loop playsInline preload="metadata" aria-hidden="true"></video>
      <div className="absolute inset-0 bg-gradient-to-t from-ink/70 via-ink/10 to-ink/20"></div>
      <div className="relative h-full flex flex-col justify-end p-6 sm:p-10 lg:p-14 text-white">
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
          <div className="lg:col-span-8">
            <h1 className="font-display font-semibold tracking-[-0.04em] leading-[0.92] text-[46px] sm:text-[78px] lg:text-[104px]">
              ${d.title.map((t, i) => html`<span key=${i} className="block overflow-hidden pb-1"><${motion.span} className="block" initial=${{ y: '105%' }} animate=${{ y: 0 }} transition=${{ duration: 1.05, ease, delay: 0.2 + i * 0.13 }}>${t}<//></span>`)}
            </h1>
            <${motion.p} initial=${{ opacity: 0, y: 14 }} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: 0.8, ease, delay: 0.7 }} className="mt-4 font-serif italic text-[28px] sm:text-[36px] text-sand">${d.sub}<//>
          </div>
          <${motion.div} initial=${{ opacity: 0, y: 20 }} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: 0.8, ease, delay: 0.9 }} className="lg:col-span-4">
            <${FindVio} dark />
            <div className="mt-4 flex items-center gap-3"><${Button} href="#quiz" variant="ghost" icon=${null} className="h-11 px-5 text-[11.5px]">Take the skin quiz<//>
              <button onClick=${toggle} aria-label=${playing ? 'Pause background video' : 'Play background video'} className="grid place-items-center w-11 h-11 rounded-full ring-1 ring-white/40 hover:bg-white/15"><${Icon} name=${playing ? 'pause' : 'play'} className="w-4 h-4" /></button></div>
          <//>
        </div>
      </div>
    <//>
  </section>`;
