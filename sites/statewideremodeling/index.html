const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.7, ease } } };
const stagger = (s = 0.08, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inViewProps = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };

const Reveal = ({ children, className = '', delay = 0 }) => html`

const Button = ({ href, children, variant = 'flame', className = '', icon = 'arrow', onClick, type }) => {
  const styles = {
    flame: 'bg-flame text-white hover:bg-flame-600 shadow-[0_12px_30px_-10px_rgba(255,82,0,.55)]',
    brand: 'bg-brand text-white hover:bg-brand-600 shadow-[0_12px_30px_-12px_rgba(0,74,179,.6)]',
    light: 'bg-white text-ink hover:bg-brand-50 ring-1 ring-ink/10',
    ghost: 'text-white ring-1 ring-white/30 hover:bg-white/10',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} onClick=${onClick} type=${type} whileHover=${{ y: -2 }} whileTap=${{ scale: 0.97 }}
    className=${`group inline-flex items-center justify-center gap-2 rounded-2xl px-6 h-12 font-display font-bold text-[15px] transition-colors duration-200 whitespace-nowrap ${styles[variant]} ${className}`}>
    ${children}${icon && html`<${Icon} name=${icon} className="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" sw=${2.2} />`}
  <//>`;
};

const Counter = ({ value, prefix = '', suffix = '' }) => {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true });
  const [n, setN] = useState(typeof value === 'number' ? 0 : value);
  useEffect(() => {
    if (!inView || typeof value !== 'number') return;
    const c = animate(0, value, { duration: 1.8, ease, onUpdate: (v) => setN(Math.round(v).toLocaleString('en-US')) });
    return () => c.stop();
  }, [inView]);
  return html`<span ref=${ref}>${prefix}${n}${suffix}</span>`;
};
