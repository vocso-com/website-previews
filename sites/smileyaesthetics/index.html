const Icon = ({ name, className = 'w-5 h-5', sw = 1.8 }) => html`

const Smile = ({ className = '' }) => html`<svg viewBox="0 0 120 30" className=${className} fill="none" aria-hidden="true"><path d="M4 6c18 22 94 22 112 0" stroke="currentColor" strokeWidth="5" strokeLinecap="round" /></svg>`;

const ease = [0.22, 1, 0.36, 1];
const fadeUp = { hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.75, ease } } };
const stagger = (s = 0.08, d = 0) => ({ hidden: {}, show: { transition: { staggerChildren: s, delayChildren: d } } });
const inView = { initial: 'hidden', whileInView: 'show', viewport: { once: true, margin: '-70px' } };
const Reveal = ({ children, className = '', delay = 0 }) => html`
  <${motion.div} className=${className} ...${inView} variants=${{ hidden: { opacity: 0, y: 24 }, show: { opacity: 1, y: 0, transition: { duration: 0.75, ease, delay } } }}>${children}<//>`;

const tel = (p) => `tel:${p.replace(/\D/g, '')}`;

const Button = ({ href, children, variant = 'teal', className = '', icon = 'arrow', type, onClick }) => {
  const styles = {
    teal: 'bg-teal text-white hover:bg-teal-700 shadow-[0_14px_30px_-12px_rgba(60,175,191,.7)]',
    slate: 'bg-slate text-white hover:bg-slate-700',

    ghost: 'ring-1 ring-white/30 text-white hover:bg-white hover:text-slate',
  };
  const Tag = href ? motion.a : motion.button;
  return html`<${Tag} href=${href} type=${type} onClick=${onClick} whileHover=${{ y: -2 }} whileTap=${{ scale: 0.97 }}
    className=${`group inline-flex items-center justify-center gap-2.5 rounded-full px-7 h-[52px] text-[15px] font-bold whitespace-nowrap transition-colors duration-300 ${styles[variant]} ${className}`}>
    ${children}${icon && html`<${Icon} name=${icon} className="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" sw=${2.2} />`}
  <//>`;
};
