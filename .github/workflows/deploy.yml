name: Tell PROSPECTS which sites went live

# Cloudflare Pages is connected to this repository directly and publishes on
# every push by itself — there is no build or deploy step here, and no
# Cloudflare credentials. All this workflow does is wait for the new site to
# actually be reachable, then tell PROSPECTS, which moves the lead's project
# from Building to "Built — review".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notify-prospects
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so we can diff and see which site folders changed.
          fetch-depth: 2

      - name: Wait for Cloudflare to publish, then report each changed site
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          APP: ${{ vars.PROSPECTS_URL }}
          PUBLIC_BASE: ${{ vars.WEBSITES_BASE_URL }}
        run: |
          set -euo pipefail

          slugs=$(git diff --name-only HEAD^ HEAD -- sites/ | cut -d/ -f2 | sort -u)
          if [ -z "$slugs" ]; then
            echo "No site folders changed; nothing to report."
            exit 0
          fi

          report() {  # slug status [url] [detail]
            curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$APP/api/webhooks/deploy" \
              -H 'content-type: application/json' \
              -H "x-deploy-secret: $SECRET" \
              -d "{\"slug\":\"$1\",\"status\":\"$2\",\"url\":\"${3:-}\",\"detail\":\"${4:-}\"}"
          }

          for slug in $slugs; do
            if [ ! -d "sites/$slug" ]; then
              echo "· $slug was removed; skipping"
              continue
            fi

            url="$PUBLIC_BASE/$slug/"
            echo "· waiting for $url"

            # Cloudflare builds asynchronously after the push, so reporting
            # immediately would tell PROSPECTS a site is ready before it is.
            # Poll for up to five minutes instead.
            #
            # Poll past Cloudflare's edge cache, not through it. A 404 served
            # before the site existed — anyone opening the link early, or the
            # previous run of this very loop — is cached at the edge and still
            # answered for hours afterwards, so a plain request can keep
            # reporting "not reachable" long after the site is live. A unique
            # query string each time is a different cache key, so every check
            # reaches the origin.
            live=""
            for i in $(seq 1 60); do
              probe="$url?ci=$GITHUB_RUN_ID-$i"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$probe" || true)
              if [ "$code" = "200" ]; then live=1; break; fi
              sleep 5
            done

            if [ -z "$live" ]; then
              echo "  never became reachable — reporting a failed deploy"
              report "$slug" failed "" "Not reachable at $url after 5 minutes" >/dev/null || true
              continue
            fi

            code=$(report "$slug" success "$url")
            case "$code" in
              200) echo "  ok: $(cat /tmp/resp.json)" ;;
              # No project is waiting on this slug — a hand-built site, or a
              # rename. Not a deploy failure, so don't fail the run.
              404) echo "  no project matched slug '$slug' — skipping" ;;
              *)   echo "  FAILED ($code): $(cat /tmp/resp.json)"; exit 1 ;;
            esac
          done
